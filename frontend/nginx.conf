server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Plantillas DOCX de hasta 20 MB (igual que el backend)
    client_max_body_size 25m;

    # La API la atiende el backend dentro de la red de Docker
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos con hash en el nombre: caché larga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Aplicación de una sola página: toda otra ruta devuelve index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
