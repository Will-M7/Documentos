<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;min-height:100%;font:14px Arial,sans-serif;color:#24292f;background:#f6f8fa}*{box-sizing:border-box}
#ruler-x{position:sticky;top:0;height:25px;background:#f6f8fa;border-bottom:1px solid #d8dee4;z-index:4;overflow:hidden}
#ruler-x .scale{height:100%;position:relative;margin:auto;background:repeating-linear-gradient(to right,#8c959f 0 1px,transparent 1px 10px);background-size:10px 8px;background-repeat:repeat-x;background-position:0 bottom}
#ruler-x .margin{position:absolute;top:0;bottom:0;background:rgba(9,105,218,.08);border-right:1px solid #8c959f}
#ruler-x .measure{position:absolute;top:1px;font:9px Arial;color:#57606a;pointer-events:none}
#ruler-y{position:absolute;left:0;top:35px;width:23px;height:calc(100% - 35px);background:repeating-linear-gradient(to bottom,#8c959f 0 1px,transparent 1px 10px);background-size:8px 10px;background-repeat:repeat-y;background-position:right 0;pointer-events:none;z-index:2}
#ruler-y .measure{position:absolute;left:1px;font:9px Arial;color:#57606a}
#workspace{padding:12px 24px 50px 28px;overflow:auto;min-height:calc(100vh - 25px)}
#sheet{width:794px;min-height:1123px;margin:0 auto;background:white;box-shadow:0 2px 12px #1f232826;padding:72px;position:relative;transform-origin:top center}
#editor{min-height:950px;outline:none;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.35;cursor:text}
#editor p{margin:0 0 8px;min-height:1em}#editor table{border-collapse:collapse;width:100%;margin:5px 0}#editor td{border:1px solid #8c959f;padding:4px;min-width:30px;vertical-align:top}
#editor table{border-spacing:0;table-layout:fixed}#editor tr{border:0}#editor td{border:1px solid #8c959f;border-spacing:0}
#table-plus{position:fixed;display:none;z-index:9;width:18px;height:18px;padding:0;border:1px solid #8c959f;border-radius:4px;background:#f6f8fa;color:#0969da;font:bold 14px Arial;cursor:pointer}
#editor img{max-width:100%;height:auto}.variable{display:inline;background:#dce8f7;color:#0969da;border-radius:3px;white-space:nowrap;cursor:grab}.variable:focus{outline:1px solid #0969da}
#drop-caret{position:fixed;width:2px;height:18px;background:#0969da;display:none;pointer-events:none;z-index:10}
.page-break{display:block;break-before:page;border-top:1px dashed #afb8c1;margin:18px -20px 16px;height:1px}
@media print{html,body,#workspace{background:white;padding:0}#sheet{box-shadow:none;margin:0}#ruler-x,#ruler-y{display:none}}
</style></head><body><div id="ruler-x"><div class="scale" id="scale-x"><i class="margin" id="margin-left"></i><i class="margin" id="margin-right"></i></div></div><div id="ruler-y"></div><div id="workspace"><div id="sheet"><div id="editor" contenteditable="true" spellcheck="true">__DOCUMENT_CONTENT__</div></div></div><div id="drop-caret"></div><button id="table-plus" title="Insertar fila o columna">+</button><script>
(function(){
var editor=document.getElementById('editor'),sheet=document.getElementById('sheet'),saved=null,dragged=null,zoom=1,original={},activeCell=null,activeImage=null,plusAction=null;
Array.from(editor.querySelectorAll('[data-id],[data-table]')).forEach(function(e){original[e.dataset.id||e.dataset.table]=e.outerHTML});
function range(){var s=window.getSelection();if(s&&s.rangeCount&&editor.contains(s.anchorNode)){saved=s.getRangeAt(0).cloneRange();return saved}return saved}
function restore(){if(!saved){editor.focus();return}editor.focus();var s=window.getSelection();s.removeAllRanges();s.addRange(saved)}
function caret(x,y){var r=document.caretRangeFromPoint?document.caretRangeFromPoint(x,y):null;return r&&editor.contains(r.startContainer)?r:null}
function token(key){var s=document.createElement('span');s.className='variable';s.contentEditable='false';s.draggable=true;s.dataset.key=key;s.textContent='⟦'+key+'⟧';s.title='{{'+key+'}}';return s}
function insert(key,x,y){var r=x===undefined?range():caret(x,y);if(!r)return false;editor.focus();r.deleteContents();var t=token(key);r.insertNode(t);r.setStartAfter(t);r.collapse(true);var s=window.getSelection();s.removeAllRanges();s.addRange(r);saved=r.cloneRange();changed();return true}
function changed(){if(window.javaBridge)window.javaBridge.markDirty()}
function table(){var s=window.getSelection(),node=s&&s.anchorNode,e=node&&node.nodeType===1?node:node&&node.parentElement,t=e&&e.closest('table');return t&&editor.contains(t)?t:activeCell&&editor.contains(activeCell)?activeCell.closest('table'):null}
function cell(){var s=window.getSelection(),node=s&&s.anchorNode,e=node&&node.nodeType===1?node:node&&node.parentElement,td=e&&e.closest('td');return td&&editor.contains(td)?td:activeCell&&editor.contains(activeCell)?activeCell:null}
function emptyCell(){var td=document.createElement('td'),p=document.createElement('p');p.appendChild(document.createElement('br'));td.appendChild(p);return td}
function tableStyle(t){var mode=t.dataset.borders||'all',width=(t.dataset.borderWidth||1)+'px',color=t.dataset.borderColor||'#8c959f',style=t.dataset.borderStyle||'solid',line=width+' '+style+' '+color,rows=Array.from(t.rows);rows.forEach(function(row,ri){Array.from(row.cells).forEach(function(td,ci){td.style.border='none';var lastRow=ri===rows.length-1,lastCol=ci===row.cells.length-1,edge=mode==='all'||mode==='outer',inner=mode==='all'||mode==='inner';if((edge&&ri===0)||(inner&&ri>0))td.style.borderTop=line;if(edge&&lastRow)td.style.borderBottom=line;if((edge&&ci===0)||(inner&&ci>0))td.style.borderLeft=line;if(edge&&lastCol)td.style.borderRight=line})})}
function notifyTable(){if(window.javaBridge)window.javaBridge.tableSelected(!!table())}
function ruler(w,h,l,t,rr,b){sheet.style.width=w+'px';sheet.style.minHeight=h+'px';sheet.style.padding=l+'px '+rr+'px '+b+'px '+l+'px';sheet.style.paddingTop=t+'px';sheet.style.backgroundImage='repeating-linear-gradient(to bottom,#fff 0px,#fff '+(h-2)+'px,#d8dee4 '+(h-2)+'px,#f6f8fa '+h+'px)';var sx=document.getElementById('scale-x');sx.style.width=w+'px';Array.from(sx.querySelectorAll('.measure')).forEach(function(e){e.remove()});for(var x=1;x*37.8<w;x++){var label=document.createElement('span');label.className='measure';label.style.left=(x*37.8)+'px';label.textContent=x;sx.appendChild(label)}document.getElementById('margin-left').style.cssText='left:0;width:'+l+'px';document.getElementById('margin-right').style.cssText='right:0;width:'+rr+'px';var ry=document.getElementById('ruler-y');ry.innerHTML='';for(var y=1;y*37.8<h;y++){var mark=document.createElement('span');mark.className='measure';mark.style.top=(y*37.8)+'px';mark.textContent=y;ry.appendChild(mark)}ry.style.backgroundPosition='right '+(t+35)+'px'}
window.studio={
  html:function(){Array.from(editor.childNodes).forEach(function(n){if(n.nodeType===3&&n.textContent.trim()||n.nodeType===1&&!/^(P|DIV|TABLE)$/.test(n.nodeName)){var p=document.createElement('p');editor.insertBefore(p,n);p.appendChild(n)}});Array.from(editor.querySelectorAll('[data-id],[data-table]')).forEach(function(e){var id=e.dataset.id||e.dataset.table;if(e.outerHTML!==original[id])e.setAttribute('data-changed','true');else e.removeAttribute('data-changed')});return new XMLSerializer().serializeToString(editor)},
  command:function(name,value){restore();document.execCommand(name,false,value||null);range();changed()},
  insertToken:function(key){return insert(key)},
  insertAt:function(x,y,key){return insert(key,x,y)},
  insertImage:function(src,width,height){var r=range();if(!r)return false;restore();r.deleteContents();var img=document.createElement('img');img.src=src;img.width=width;img.height=height;r.insertNode(img);r.setStartAfter(img);r.collapse(true);var s=window.getSelection();s.removeAllRanges();s.addRange(r);saved=r.cloneRange();changed();return true},
  insertTable:function(cols,rows){var r=range();if(!r||cols<1||rows<1)return false;restore();var t=document.createElement('table');t.dataset.borders='all';for(var y=0;y<rows;y++){var tr=t.insertRow();for(var x=0;x<cols;x++)tr.appendChild(emptyCell())}tableStyle(t);var block=r.startContainer.nodeType===1?r.startContainer:r.startContainer.parentElement;block=block.closest('p,div');if(block&&block.parentElement===editor){var after=block.cloneNode(false),tail=document.createRange();after.removeAttribute('data-id');after.removeAttribute('data-changed');tail.setStart(r.startContainer,r.startOffset);tail.setEndAfter(block.lastChild||block);after.appendChild(tail.extractContents());block.after(t);t.after(after)}else{r.insertNode(t)}var first=t.querySelector('td p'),focus=document.createRange();focus.selectNodeContents(first);focus.collapse(true);var s=window.getSelection();s.removeAllRanges();s.addRange(focus);saved=focus.cloneRange();activeCell=t.querySelector('td');changed();notifyTable();return true},
  tableAction:function(action,value){var t=table(),td=cell();if(!t)return false;var row=td&&td.parentElement,index=td?Array.prototype.indexOf.call(row.cells,td):0;if(action==='deleteTable'){t.remove();activeCell=null;notifyTable();changed();return true}if(!td)return false;
    if(action==='insertRowBefore'||action==='insertRowAfter'){var newRow=t.insertRow(row.rowIndex+(action==='insertRowAfter'?1:0));for(var c=0;c<row.cells.length;c++)newRow.appendChild(emptyCell())}
    else if(action==='deleteRow'){if(t.rows.length===1){t.remove();activeCell=null;notifyTable();changed();return true}var rowIndex=row.rowIndex;row.remove();activeCell=t.rows[Math.min(rowIndex,t.rows.length-1)].cells[0]}
    else if(action==='insertColumnBefore'||action==='insertColumnAfter'){Array.from(t.rows).forEach(function(r){r.insertBefore(emptyCell(),r.cells[index+(action==='insertColumnAfter'?1:0)]||null)})}
    else if(action==='deleteColumn'){if(row.cells.length===1){t.remove();activeCell=null;notifyTable();changed();return true}Array.from(t.rows).forEach(function(r){if(r.cells[index])r.cells[index].remove()});activeCell=row.cells[Math.min(index,row.cells.length-1)]}
    else if(action==='borders')t.dataset.borders=value;
    else if(action==='borderStyle')t.dataset.borderStyle=value;
    else if(action==='borderWidth')t.dataset.borderWidth=value;
    else if(action==='borderColor')t.dataset.borderColor=value;
    tableStyle(t);changed();return true},
  imageAction:function(action){var img=activeImage;if(!img||!editor.contains(img))return false;if(action==='delete'){img.remove();activeImage=null;if(window.javaBridge)window.javaBridge.imageSelected(false)}else if(action==='smaller'||action==='larger'){var factor=action==='smaller'?.75:1.25;img.width=Math.max(20,Math.round(img.getBoundingClientRect().width/zoom*factor));img.height=Math.max(20,Math.round(img.getBoundingClientRect().height/zoom*factor))}else{var p=img.closest('p');if(p)p.style.textAlign=action}changed();return true},
  showDrop:function(x,y){var r=caret(x,y),c=document.getElementById('drop-caret');if(!r){c.style.display='none';return false}var box=r.getBoundingClientRect();c.style.left=box.left+'px';c.style.top=box.top+'px';c.style.height=Math.max(16,box.height)+'px';c.style.display='block';return true},
  hideDrop:function(){document.getElementById('drop-caret').style.display='none'},
  paper:ruler,
  zoom:function(z){zoom=z;sheet.style.zoom=z;document.getElementById('scale-x').style.zoom=z;return z},
  currentPage:function(){var h=sheet.getBoundingClientRect().height,visible=Math.max(0,-sheet.getBoundingClientRect().top);return Math.max(1,Math.floor(visible/Math.max(1,1123*zoom))+1)},
  pageCount:function(){return Math.max(1,Math.ceil(sheet.scrollHeight/Math.max(1,1123)))},
  focus:function(){restore()}
};
document.addEventListener('selectionchange',range);editor.addEventListener('keyup',range);editor.addEventListener('mouseup',range);editor.addEventListener('input',changed);
editor.addEventListener('click',function(e){activeCell=e.target.closest('td');activeImage=e.target.closest('img');notifyTable();if(window.javaBridge)window.javaBridge.imageSelected(!!activeImage)});
editor.addEventListener('keyup',notifyTable);
var plus=document.getElementById('table-plus');editor.addEventListener('mousemove',function(e){var td=e.target.closest('td');if(!td){plus.style.display='none';return}var box=td.getBoundingClientRect(),top=Math.abs(e.clientY-box.top),left=Math.abs(e.clientX-box.left);if(top>10&&left>10){plus.style.display='none';return}activeCell=td;plusAction=top<=left?'insertRowBefore':'insertColumnBefore';plus.style.left=(top<=left?box.left+box.width/2-9:box.left-9)+'px';plus.style.top=(top<=left?box.top-9:box.top+box.height/2-9)+'px';plus.style.display='block'});
plus.addEventListener('click',function(e){e.preventDefault();if(plusAction)window.studio.tableAction(plusAction);plus.style.display='none'});
window.addEventListener('scroll',function(){if(window.javaBridge)window.javaBridge.pageMoved()},true);
editor.addEventListener('keydown',function(e){if(e.ctrlKey&&e.key.toLowerCase()==='y'){e.preventDefault();document.execCommand('redo')}});
editor.addEventListener('dragstart',function(e){var t=e.target.closest('.variable');if(t){dragged=t;e.dataTransfer.setData('text/plain',t.dataset.key);e.dataTransfer.effectAllowed='move'}});
editor.addEventListener('dragover',function(e){if(e.dataTransfer.types&&Array.from(e.dataTransfer.types).indexOf('text/plain')>=0){e.preventDefault();window.studio.showDrop(e.clientX,e.clientY)}});
editor.addEventListener('drop',function(e){e.preventDefault();window.studio.hideDrop();var key=e.dataTransfer.getData('text/plain');if(key&&insert(key,e.clientX,e.clientY)&&dragged&&dragged.isConnected){dragged.remove();changed()}dragged=null});
editor.addEventListener('dragend',function(){dragged=null;window.studio.hideDrop()});
editor.addEventListener('click',function(e){var t=e.target.closest('.variable');if(t){var r=document.createRange();r.selectNode(t);var s=window.getSelection();s.removeAllRanges();s.addRange(r);saved=r.cloneRange()}});
function selectedToken(){var s=window.getSelection();if(!s.rangeCount)return null;var fragment=s.getRangeAt(0).cloneContents(),tokens=fragment.querySelectorAll('.variable');return tokens.length===1&&fragment.textContent.trim()===tokens[0].textContent.trim()?tokens[0].dataset.key:null}
editor.addEventListener('copy',function(e){var key=selectedToken();if(key){e.preventDefault();e.clipboardData.setData('text/plain','{{'+key+'}}')}});
editor.addEventListener('cut',function(e){var key=selectedToken();if(key){e.preventDefault();e.clipboardData.setData('text/plain','{{'+key+'}}');window.getSelection().getRangeAt(0).deleteContents();changed()}});
editor.addEventListener('paste',function(e){var text=e.clipboardData&&e.clipboardData.getData('text/plain');if(text&&/^\{\{[a-zA-Z][a-zA-Z0-9_]*\}\}$/.test(text)){e.preventDefault();insert(text.slice(2,-2))}});
})();
</script></body></html>
