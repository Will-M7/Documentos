name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Base de pruebas, igual a la que cada desarrollador tiene instalada en su PC
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: estudio_documental_test
          POSTGRES_USER: estudio
          POSTGRES_PASSWORD: estudio_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U estudio"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Formato
        run: ./mvnw -B spotless:check
      - name: Compilar y probar
        run: ./mvnw -B verify

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Formato
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Pruebas
        run: npm test
      - name: Compilar
        run: npm run build
